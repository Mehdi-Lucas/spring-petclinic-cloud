name: Build-push-deploy

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.1.1

    - name: Set up JDK 11
      uses: actions/setup-java@v3.13.0
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.1.1

    - name: Set up JDK 11
      uses: actions/setup-java@v3.13.0
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: maven

    - name: Run Tests with Maven
      run: mvn test --file pom.xml
      
  secure:
    needs: test
    name: Microsoft Security DevOps Analysis
    # MSDO runs on windows-latest.
    # ubuntu-latest also supported
    runs-on: windows-latest
    steps:
      # Checkout your code repository to scan
    - uses: actions/checkout@v3
      # Run analyzers
    - name: Run Microsoft Security DevOps Analysis
      uses: microsoft/security-devops-action@latest
      id: msdo
      with:
        policy: 'GitHub'
      # config: string. Optional. A file path to an MSDO configuration file ('*.gdnconfig').
      # policy: 'GitHub' | 'microsoft' | 'none'. Optional. The name of a well-known Microsoft policy. If no configuration file or list of tools is provided, the policy may instruct MSDO which tools to run. Default: GitHub.
      # categories: string. Optional. A comma-separated list of analyzer categories to run. Values: 'secrets', 'code', 'artifacts', 'IaC', 'containers. Example: 'IaC,secrets'. Defaults to all.
      # languages: string. Optional. A comma-separated list of languages to analyze. Example: 'javascript,typescript'. Defaults to all.
      # tools: string. Optional. A comma-separated list of analyzer tools to run. Values: 'bandit', 'binskim', 'eslint', 'templateanalyzer', 'terrascan', 'trivy'.

      # Upload alerts to the Security tab
    - name: Upload alerts to Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: ${{ steps.msdo.outputs.sarifFile }}

      # Upload alerts file as a workflow artifact
    - name: Upload alerts file as a workflow artifact
      uses: actions/upload-artifact@v3
      with:  
        name: alerts
        path: ${{ steps.msdo.outputs.sarifFile }}
        
  push-docker-images:
    needs: secure
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.1.1

    - name: Set up JDK 11
      uses: actions/setup-java@v3.13.0
      with:
        java-version: '11'
        distribution: 'adopt'
        cache: maven

    - name: Log in to Docker Hub
      uses: docker/login-action@v3.1.0
      with:
        username: ${{ secrets.DOCKERHUB_ID }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

        
    - name: Set up Docker Repository Prefix
      run: |
        echo "REPOSITORY_PREFIX=${{ secrets.DOCKERHUB_ID }}" >> $GITHUB_ENV
        echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
    
    - name: Build and Push Docker Images
      run: mvn spring-boot:build-image -Pk8s -DREPOSITORY_PREFIX=${{ secrets.DOCKERHUB_ID }} && ./scripts/pushImages.sh

  deploy-on-dev:
    needs: push-docker-images
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.1.1

    - name: Set up kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

    - name: Clean older Kubernetes deployments in dev
      run: |
        kubectl delete all --all -n dev || true &&
        kubectl delete pvc --all -n dev || true &&
        helm uninstall customers-db-mysql vets-db-mysql visits-db-mysql -n dev || true

    - name: Create secret in dev
      run: |
        kubectl delete secret wavefront -n dev || true &&
        kubectl create secret generic wavefront -n dev --from-literal=wavefront-url=https://wavefront.surf --from-literal=wavefront-api-token=2e41f7cf-1111-2222-3333-7397a56113c

    - name: Apply Kubernetes init-services in dev
      run: kubectl apply -f k8s/init-services -n dev

    - name: Install database helm charts in dev
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami &&
        helm repo update &&
        helm upgrade --install vets-db-mysql bitnami/mysql \
          --namespace dev \
          --version 9.1.4 \
          --set auth.database=service_instance_db &&
        helm upgrade --install visits-db-mysql bitnami/mysql \
          --namespace dev \
          --version 9.1.4 \
          --set auth.database=service_instance_db &&
        helm upgrade --install customers-db-mysql bitnami/mysql \
          --namespace dev \
          --version 9.1.4 \
          --set auth.database=service_instance_db

    - name: Apply Kubernetes deployments in dev
      run: |
        mkdir -p /tmp/k8s
        cp k8s/*.yaml /tmp/k8s
        cat /tmp/k8s/*.yaml | \
          sed "s#\${REPOSITORY_PREFIX}#${{ secrets.DOCKERHUB_ID }}#g" | \
          kubectl apply -f - -n dev
          
  update-second-repo:
    needs: deploy-on-dev 
    name: Clone update and Push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup SSH
      uses: MrSquaare/ssh-setup-action@v1
      with:
          host: github.com
          private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          
    - name: Clone repository
      run: |
        rm -Rf *
        git clone git@github.com:Mehdi-Lucas/spring-petclinic-cloud-deployment.git
        ls
        cd spring-petclinic-cloud-deployment/
        cat values.yaml
        sed -i "s+tag.*+tag: ${GITHUB_SHA}+g" values.yaml
        cat values.yaml
    - name: Commit and push changes
      run: |
        ls
        cd spring-petclinic-cloud-deployment
        git config --global user.name "Mehdi-Lucas"
        git config --global user.email "${{ secrets.GIT_EMAIL }}"
        git add -A
        git commit -m "mis à jour de l'image avec le tag ${GITHUB_SHA}"
        git push origin master
